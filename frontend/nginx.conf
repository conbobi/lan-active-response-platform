server {
    listen 80;
    server_name localhost edr.alwayready.id.vn;

    # Tối ưu kích thước upload file
    client_max_body_size 50M;

    # Gzip nén dữ liệu tĩnh
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Thư mục chứa code React đã build
    root /usr/share/nginx/html;
    index index.html;

    # Xử lý React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache tài nguyên tĩnh (assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse proxy cho REST API sang backend FastAPI (container manager)
    location /api/ {
        proxy_pass http://manager:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Reverse proxy cho WebSocket (/ws/dashboard và /ws/agent)
    location /ws/ {
        proxy_pass http://manager:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Giữ kết nối WebSocket không bị ngắt quãng
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
