version: '3.8'

services:
  db:
    image: postgres:16-alpine # Bản cài đặt PostgreSQL 16 alpine nhẹ và tiết kiệm tài nguyên
    restart: unless-stopped
    environment:
      POSTGRES_USER: larp
      POSTGRES_PASSWORD: larp_password
      POSTGRES_DB: larpdb
    ports:
      - "5432:5432" # Truy cập DB trực tiếp từ máy host nếu cần debug
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - larp-net
    privileged: true
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U larp -d larpdb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  manager:
    build: ./manager # Build FastAPI backend từ ./manager
    restart: unless-stopped
    ports:
      - "8005:8000" # Mở port 8000 ra máy host port 8005
    environment:
      - DATABASE_URL=postgresql+asyncpg://larp:larp_password@db:5432/larpdb
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/1540670659749875733/yeMQIpiSsydQW3jzAf8wQplCFheUWm8UVmN3YWgoiOgqALgkpSnLx2mJiR6ai934UlHU
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./manager:/app
    networks:
      - larp-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80" # HTTP tiêu chuẩn cho máy host
      - "5173:80" # Giữ port 5173 quen thuộc để truy cập từ localhost
    depends_on:
      manager:
        condition: service_healthy
    networks:
      - larp-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    networks:
      - larp-net

  client1:
    build: ./agent
    hostname: client1
    restart: unless-stopped
    environment:
      - MANAGER_URL=ws://manager:8000/ws/agent
      - AGENT_ID=client1
      - BASH_ENV=/etc/bash_env
    networks:
      - larp-net
    depends_on:
      manager:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    mem_limit: 2g
    mem_reservation: 512m

networks:
  larp-net:
    driver: bridge

volumes:
  pgdata:
