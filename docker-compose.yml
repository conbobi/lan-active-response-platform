version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: larp
      POSTGRES_PASSWORD: larp_password
      POSTGRES_DB: larpdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - larp-net
    privileged: true
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U larp -d larpdb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  manager:
    build: ./manager
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://larp:larp_password@db:5432/larpdb
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/1540670659749875733/yeMQIpiSsydQW3jzAf8wQplCFheUWm8UVmN3YWgoiOgqALgkpSnLx2mJiR6ai934UlHU
      - OLLAMA_URL=http://ollama:11434
      - AI_MODEL
      - AI_TRIAGE_NUM_CTX
      - AI_TRIAGE_NUM_PREDICT
      - AI_TRIAGE_TEMPERATURE
      - AI_TRIAGE_KEEP_ALIVE
      - AI_TRIAGE_STREAM
      - AI_TRIAGE_THINK
      - AI_TRIAGE_GGUF
      - AI_TRIAGE_MAX_WAITING
      - AI_TRIAGE_ENABLE_SKIP
      - NETWORK_AGENT_TOKENS
      - NETWORK_OPERATORS
      - NETWORK_LEGACY_ADMIN_TOKEN
      - NETWORK_SSH_PROBES
      - DEBUG=${LARP_MANAGER_DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./manager:/app
      - ./agent:/app/agent:ro
      - ./models:/models:ro
    networks:
      - larp-net

  ollama:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/models:ro
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped
    networks:
      - larp-net
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      manager:
        condition: service_healthy
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - larp-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    networks:
      - larp-net
  # client1:
  #   build: ./agent
  #   hostname: client1
  #   restart: unless-stopped
  #   environment:
  #     - MANAGER_URL=ws://manager:8000/ws/agent
  #     - AGENT_ID=client1
