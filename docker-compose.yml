version: '3.8'

services:
  db:
    image: postgres:16-alpine #Tải bản cài đặt PostgreSQL phiên bản 16 (dùng bản alpine cho siêu nhẹ, tiết kiệm dung lượng).
    environment:
      POSTGRES_USER: larp # dặt tên môi trường ảo là larp
      POSTGRES_PASSWORD: larp_password
      POSTGRES_DB: larpdb
    ports:
      - "5432:5432"   # Tùy chọn, để truy cập DB từ máy host nếu cần debug
    volumes:
      - pgdata:/var/lib/postgresql/data #Đây là "két sắt bảo vệ dữ liệu". Khi container bị tắt đi hay xóa đi làm lại, dữ liệu bên trong vẫn được giữ lại an toàn ở ổ cứng máy thật, không bị mất.
    networks:
      - larp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larp -d larpdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  manager:
    build: ./manager #Bảo Docker đi vào thư mục ./manager tìm file Dockerfile để tự động xây dựng nên "tòa nhà" Manager của bạn.
    ports:
      - "8000:8000" #Mở cổng 8000 ra máy thật để bạn có thể mở trình duyệt web lên xem Dashboard
    environment:
      - DATABASE_URL=postgresql+asyncpg://larp:larp_password@db:5432/larpdb #Đây là "đường ống" kết nối từ tòa nhà Manager đến két sắt bảo vệ dữ liệu (PostgreSQL). Lưu ý: db chính là tên dịch vụ PostgreSQL ở trên, không phải localhost hay 127.0.0.1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - larp-net

  # Định nghĩa các agent (client1, client2...) như trước
  client1:
    build: ./agent #Dùng chung một bản thiết kế (Dockerfile) trong thư mục ./agent để tạo ra các máy con.
    hostname: client1 #Đặt tên định danh cho máy trạm này trong mạng nội bộ.
    environment:
      - MANAGER_URL=ws://manager:8000/ws/agent #Đây là "đường dây liên lạc" giữa máy trạm và tòa nhà Manager. Lưu ý: manager chính là tên dịch vụ Manager ở trên, không phải localhost hay 127.0.0.1
      - AGENT_ID=client1
    networks:
      - larp-net
    depends_on:
      - manager #Đảm bảo tổng đài manager phải mở cửa sẵn sàng đón khách thì các máy con client1, client2 mới được phép kết nối vào.

  client2:
    build: ./agent
    hostname: client2
    environment:
      - MANAGER_URL=ws://manager:8000/ws/agent
      - AGENT_ID=client2
    networks:
      - larp-net
    depends_on:
      - manager

networks:
  larp-net:
    driver: bridge #Đây chính là "hệ thống giao thông nội bộ" của thành phố ảo

volumes:
  pgdata: