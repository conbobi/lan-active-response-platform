  #   networks:
  #     - larp-net
  #   depends_on:
  #     manager:
  #       condition: service_healthy
  #   cap_add:
  #     - NET_ADMIN
  #   mem_limit: 2g
  #   mem_reservation: 512m

networks:
  larp-net:
    driver: bridge

volumes:
  pgdata:
  ollama_data:
