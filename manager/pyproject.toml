[project]
name = "manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "aiogram>=3.30.0",
    "aiosqlite>=0.22.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "pyjwt>=2.10.0",
    "docker>=7.1.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "gguf==0.19.0",
    "jinja2==3.1.6",
    "tokenizers==0.23.3",
    "joblib>=1.6.0",
    "networkx>=3.6.1",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pydantic-core>=2.46.4",
    "pydantic-settings>=2.15.0",
    "pytest",
    "pytest-asyncio",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
    "websockets>=17.1",
    "yara-python>=4.5.4",
]

[project.scripts]
larp = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "deadcode>=2.4.1",
    "flask>=3.1.3",
    "pydeps>=3.0.8",
    "ruff>=0.16.6",
    "skylos>=4.36.1",
    "vulture>=2.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.vulture]
min_confidence = 80
paths = ["app"]
ignore_names = ["*_router", "*_service", "*_rule", "get_*", "process_*"]
ignore_decorators = ["@app.*", "@router.*"]

[tool.deadcode]
paths = ["app"]
exclude = ["app/services/risk_rules/*"]

